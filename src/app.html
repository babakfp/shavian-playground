<!doctype html>
<html class="select-none" lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="icon" href="/favicon.png" />

        <link
            rel="preload"
            as="font"
            type="font/woff2"
            href="/fonts/InterAlia[wght].woff2"
            crossorigin="anonymous"
        />
        <link
            rel="preload"
            as="font"
            type="font/otf"
            href="/fonts/Ormin-Regular.otf"
            crossorigin="anonymous"
        />
        <link
            rel="preload"
            as="font"
            type="font/otf"
            href="/fonts/DoolittleGaramond-Regular.otf"
            crossorigin="anonymous"
        />
        <link
            rel="preload"
            as="font"
            type="font/otf"
            href="/fonts/DoolittleGaramond-Italic.otf"
            crossorigin="anonymous"
        />
        <link
            rel="preload"
            as="font"
            type="font/ttf"
            href="/fonts/Everson Mono.ttf"
            crossorigin="anonymous"
        />
        <link
            rel="preload"
            as="font"
            type="font/ttf"
            href="/fonts/Everson Mono Bold.ttf"
            crossorigin="anonymous"
        />
        <link
            rel="preload"
            as="font"
            type="font/ttf"
            href="/fonts/Everson Mono Oblique.ttf"
            crossorigin="anonymous"
        />
        <link
            rel="preload"
            as="font"
            type="font/ttf"
            href="/fonts/Everson Mono Bold Oblique.ttf"
            crossorigin="anonymous"
        />
        <style>
            @font-face {
                font-family: "InterAlia Variable";
                font-style: normal;
                font-display: block;
                font-weight: 100 900;
                /* prettier-ignore */
                src: url("/fonts/InterAlia[wght].woff2") format("woff2-variations");
            }
            @font-face {
                font-family: "Ormin";
                font-style: normal;
                font-display: block;
                src: url("/fonts/Ormin-Regular.otf") format("opentype");
            }
            @font-face {
                font-family: "Doolittle Garamond";
                font-style: normal;
                font-display: block;
                src: url("/fonts/DoolittleGaramond-Regular.otf")
                    format("opentype");
            }
            @font-face {
                font-family: "Doolittle Garamond Italic";
                font-style: italic;
                font-display: block;
                src: url("/fonts/DoolittleGaramond-Italic.otf")
                    format("opentype");
            }
            @font-face {
                font-family: "Everson Mono";
                font-style: normal;
                font-display: block;
                font-weight: 400;
                src: url("/fonts/Everson Mono.ttf") format("truetype");
            }
            @font-face {
                font-family: "Everson Mono";
                font-style: normal;
                font-display: block;
                font-weight: 600;
                src: url("/fonts/Everson Mono Bold.ttf") format("truetype");
            }
            @font-face {
                font-family: "Everson Mono Oblique";
                font-style: italic;
                font-display: block;
                font-weight: 400;
                src: url("/fonts/Everson Mono Oblique.ttf") format("truetype");
            }
            @font-face {
                font-family: "Everson Mono Oblique";
                font-style: italic;
                font-display: block;
                font-weight: 600;
                src: url("/fonts/Everson Mono Bold Oblique.ttf")
                    format("truetype");
            }
        </style>

        %sveltekit.head%
    </head>
    <body class="bg-background text-foreground">
        <div class="contents">%sveltekit.body%</div>
    </body>
</html>
